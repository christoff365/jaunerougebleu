# Configuration de Pages CMS (https://app.pagescms.org)
# Décrit les formulaires qui permettent de modifier le site :
# - « Expositions » : les expositions spéciales, enregistrées dans expositions.json ;
# - « Expositions des mouvements » : une exposition par mouvement de l'onglet Mouvements, dans mouvements.json ;
# - « Collection du générateur » : les œuvres du générateur d'exposition, enregistrées dans collection.json.
# Le site lit ces fichiers à chaque visite.

# Médiathèque : tout le dossier images/ (sous-dossiers collection, expositions, oeuvres)
media:
  input: images
  output: images

content:
  - name: expositions
    label: Expositions
    type: file
    path: expositions.json
    format: json
    list: true
    fields:
      - name: title
        label: Titre de l'exposition
        type: string
        required: true
      - name: subtitle
        label: Sous-titre
        type: string
      - name: status
        label: Statut
        type: select
        default: draft
        options:
          values:
            - name: published
              label: Publiée (visible sur le site)
            - name: draft
              label: Brouillon (invisible)
      - name: theme
        label: Thème comparatif
        type: select
        options:
          values:
            - Lumière & ombre à travers les cultures
            - "Portrait : Orient vs Occident"
            - Sacré & profane
            - La nature dans l'art mondial
            - Paysage à travers les cultures
            - Croyances & spiritualités du monde
            - Corps & identité
            - Guerre & paix
            - Abstraction universelle
            - Couleur & perception
      - name: cover
        label: "Image de couverture (carte de l'accueil, format 16:10 conseillé) : si vide, la première œuvre non sensible de l'exposition"
        type: image
      - name: intro
        label: Introduction éditoriale
        type: text
      - name: minimum
        label: "Nombre minimum de pays différents (20 par défaut) : chaque œuvre doit avoir son commentaire ; ajoutez des œuvres commentées jusqu'à ce nombre"
        type: number
        default: 20
      - name: search
        label: "Recherche automatique (déconseillé) : complète l'exposition jusqu'au nombre de pays voulu avec des œuvres trouvées en direct, sans commentaire"
        type: object
        fields:
          - name: auto
            label: "Compléter automatiquement avec des œuvres sans commentaire (à ne cocher que si l'exposition manque de pays)"
            type: boolean
            default: false
          - name: keywords
            label: "Mots-clés en anglais, langue des catalogues (ex. : Navajo blanket, textile, light). Sans mot-clé, le thème de l'exposition est utilisé"
            type: string
          - name: regions
            label: Régions où chercher (toutes si rien n'est coché)
            type: select
            options:
              multiple: true
              values: ["Europe", "Asie de l'Est", "Asie du Sud et du Sud-Est", "Amériques", "Afrique", "Moyen-Orient", "Océanie"]
          - name: epochs
            label: Époques (toutes si rien n'est coché)
            type: select
            options:
              multiple: true
              values: ["Antiquité", "Moyen Âge", "Renaissance", "XVIIe–XVIIIe s.", "XIXe siècle", "Modernisme", "Art contemporain"]
      - name: works
        label: Œuvres à comparer
        type: object
        list: true
        fields:
          - name: link
            label: "Lien de l'œuvre au musée (Met, Art Institute of Chicago, Cleveland ou Wikidata) : l'image, le titre, l'artiste, la date, le musée et le crédit sont alors lus automatiquement ; les champs remplis ci-dessous restent prioritaires"
            type: string
          - name: title
            label: "Titre de l'œuvre (facultatif si un lien est donné)"
            type: string
          - name: artist
            label: Artiste
            type: string
          - name: country
            label: Pays
            type: string
          - name: period
            label: Période
            type: string
          - name: museum
            label: Musée
            type: string
          - name: image
            label: "Image de l'œuvre (domaine public uniquement ; facultative si un lien est donné, mais utile si le musée ne répond pas)"
            type: image
          - name: sensible
            label: "Image sensible (violence, nudité…) : floutée jusqu'à ce que le visiteur choisisse de la voir"
            type: boolean
          - name: credit
            label: "Crédit de l'image (ex. : Musée du Louvre, via Wikimedia Commons (lien), domaine public)"
            type: string
          - name: analysis
            label: Analyse éditoriale
            type: text
          - name: compare
            label: Point de comparaison avec les autres œuvres
            type: text
      - name: research
        label: "Ce que dit la recherche (facultatif) : paragraphes affichés après les œuvres, avec leurs références entre parenthèses"
        type: object
        list: true
        fields:
          - name: title
            label: Titre du paragraphe
            type: string
          - name: text
            label: Texte
            type: text
      - name: bibliography
        label: "Bibliographie (facultative) : une référence par ligne, affichée en fin d'exposition"
        type: object
        list: true
        fields:
          - name: reference
            label: "Référence complète (auteurs, année, titre, revue, volume, pages)"
            type: text
          - name: url
            label: "Lien (DOI ou page de la publication)"
            type: string

  - name: mouvements
    label: Expositions des mouvements
    type: file
    path: mouvements.json
    format: json
    list: true
    fields:
      - name: mouvement
        label: "Mouvement (le bouton de l'onglet Mouvements ouvre cette exposition)"
        type: select
        required: true
        options:
          values: ["Aztèques", "Incas", "Empire du Mali", "Chine, des origines à 1912", "Ukiyo-e", "École Rinpa", "École Kanō", "Paysage monumental des Song", "Peinture lettrée", "École de Shanghai", "Peinture de la dynastie Joseon", "Peinture moghole", "Peinture rajpoute et pahari", "École du Bengale", "Art khmer d'Angkor", "Art assyrien", "Miniature persane", "Peinture ottomane", "Art mamelouk", "Aksoum", "Égypte ancienne", "Art amarnien", "Art d'Ifé", "Art de cour du royaume du Bénin", "Peinture chrétienne éthiopienne", "Art maya classique", "École de Cuzco", "Peinture de castas", "Hudson River School", "Sculpture maorie", "Art du Sepik", "Grèce antique", "Rome antique", "Art gothique", "Renaissance", "Baroque", "Néoclassicisme", "Romantisme", "École de Barbizon", "Réalisme", "Impressionnisme", "Postimpressionnisme", "Symbolisme", "Art nouveau", "Expressionnisme", "Pionniers de l'abstraction"]
      - name: slug
        label: "Identifiant court sans espace ni accent (ex. : ukiyo-e) : nom du fichier de traductions i18n-mouvements/<identifiant>.js"
        type: string
      - name: title
        label: Titre de l'exposition
        type: string
        required: true
      - name: subtitle
        label: Sous-titre
        type: string
      - name: status
        label: Statut
        type: select
        default: draft
        options:
          values:
            - name: published
              label: Publiée (visible sur le site)
            - name: draft
              label: "Brouillon (invisible : le bouton lance alors l'exposition en direct)"
      - name: intro
        label: Introduction éditoriale
        type: text
      - name: works
        label: Œuvres à comparer
        type: object
        list: true
        fields:
          - name: link
            label: "Lien de l'œuvre au musée (Met, Art Institute of Chicago, Cleveland ou Wikidata) : l'image, le titre, l'artiste, la date, le musée et le crédit sont alors lus automatiquement ; les champs remplis ci-dessous restent prioritaires"
            type: string
          - name: title
            label: "Titre de l'œuvre (facultatif si un lien est donné)"
            type: string
          - name: artist
            label: Artiste
            type: string
          - name: country
            label: Pays
            type: string
          - name: period
            label: Période
            type: string
          - name: museum
            label: Musée
            type: string
          - name: image
            label: "Image de l'œuvre (domaine public uniquement ; facultative si un lien est donné, mais utile si le musée ne répond pas)"
            type: image
          - name: sensible
            label: "Image sensible (violence, nudité…) : floutée jusqu'à ce que le visiteur choisisse de la voir"
            type: boolean
          - name: credit
            label: "Crédit de l'image (ex. : Musée du Louvre, via Wikimedia Commons (lien), domaine public)"
            type: string
          - name: analysis
            label: Analyse éditoriale
            type: text
          - name: compare
            label: Point de comparaison avec les autres œuvres
            type: text
          - name: lieu
            label: "Lieu sur la carte (civilisations) : nom exact d'un des lieux de la carte, vide si l'origine n'est pas connue avec précision"
            type: string
          - name: lieuType
            label: Type de lieu
            type: select
            options:
              values: [site, découverte, fabrication, représenté, origine]
          - name: lieuProbable
            label: "Lieu probable seulement (affiche « probablement »)"
            type: boolean
      - name: carte
        label: "Carte (facultative, pour les civilisations) : fond de carte, limites en degrés et lieux"
        type: object
        fields:
          - name: image
            label: "Fond de carte (SVG dans images/mouvements/cartes/)"
            type: string
          - name: ouest
            label: Longitude ouest
            type: number
          - name: est
            label: Longitude est
            type: number
          - name: sud
            label: Latitude sud
            type: number
          - name: nord
            label: Latitude nord
            type: number
          - name: lieux
            label: Lieux (points de la carte)
            type: object
            list: true
            fields:
              - name: nom
                label: Nom du lieu
                type: string
              - name: lat
                label: Latitude
                type: number
              - name: lon
                label: Longitude
                type: number
          - name: note
            label: "Légende propre à cette carte (facultative)"
            type: text
          - name: pays
            label: "Pays d'aujourd'hui affichés en gris pour se repérer (nom en français, traduit dans i18n-mouvements)"
            type: object
            list: true
            fields:
              - name: nom
                label: Nom du pays
                type: string
              - name: lat
                label: Latitude de l'étiquette
                type: number
              - name: lon
                label: Longitude de l'étiquette
                type: number
          - name: villes
            label: "Grandes villes d'aujourd'hui affichées en gris pour se repérer"
            type: object
            list: true
            fields:
              - name: nom
                label: Nom de la ville
                type: string
              - name: lat
                label: Latitude
                type: number
              - name: lon
                label: Longitude
                type: number
      - name: contexte
        label: "La civilisation en bref (facultatif, pour les civilisations) : paragraphes affichés après l'introduction (société, vie quotidienne, croyances, archéologie)"
        type: object
        list: true
        fields:
          - name: title
            label: Titre du paragraphe
            type: string
          - name: text
            label: Texte
            type: text
      - name: bibliography
        label: "Sources (facultatives) : une référence par ligne, affichée en fin d'exposition"
        type: object
        list: true
        fields:
          - name: reference
            label: "Référence (auteur, titre, éditeur, année, ou nom du site)"
            type: text
          - name: url
            label: Lien
            type: string

  - name: collection
    label: Collection du générateur
    type: file
    path: collection.json
    format: json
    list: true
    fields:
      - name: title
        label: Titre de l'œuvre
        type: string
        required: true
      - name: artist
        label: "Artiste (ou atelier, ex. : Artiste olmèque)"
        type: string
        required: true
      - name: date
        label: "Date affichée (ex. : vers 1665, 1000–400 av. J.-C.)"
        type: string
        required: true
      - name: year
        label: "Année pour le classement chronologique (nombre ; négatif avant J.-C., ex. : -700)"
        type: number
        required: true
      - name: place
        label: "Lieu de création (ex. : Pays-Bas, Ispahan, Iran)"
        type: string
      - name: museum
        label: "Musée où l'œuvre est conservée (ex. : Rijksmuseum, Amsterdam)"
        type: string
      - name: regions
        label: Régions (une ou plusieurs)
        type: select
        required: true
        options:
          multiple: true
          values: ["Europe", "Asie de l'Est", "Asie du Sud et du Sud-Est", "Amériques", "Afrique", "Moyen-Orient", "Océanie"]
      - name: types
        label: Types d'œuvre (un ou plusieurs)
        type: select
        required: true
        options:
          multiple: true
          values: ["Peinture", "Sculpture", "Architecture", "Dessins et estampes", "Manuscrits et livres enluminés", "Icônes", "Arts décoratifs", "Photographie"]
      - name: epoch
        label: Époque
        type: select
        required: true
        options:
          values: ["Antiquité", "Moyen Âge", "Renaissance", "XVIIe–XVIIIe s.", "XIXe siècle", "Modernisme", "Art contemporain"]
      - name: themes
        label: Thèmes (un ou plusieurs)
        type: select
        required: true
        options:
          multiple: true
          values: ["Portraits", "Paysages", "Abstraction", "Spiritualité", "Vie quotidienne", "Mythologie", "Nature morte", "Lumière & couleur"]
      - name: image
        label: "Image de l'œuvre (domaine public uniquement ; à ranger dans le dossier collection)"
        type: image
        required: true
      - name: credit
        label: "Crédit de l'image (ex. : The Metropolitan Museum of Art (lien vers la fiche), domaine public)"
        type: string
        required: true
      - name: sensible
        label: "Image sensible (violence, nudité…) : floutée jusqu'à ce que le visiteur choisisse de la voir"
        type: boolean
